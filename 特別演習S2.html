<p><strong>【設定と不均質媒質モデル】</strong><br />

<header>特別演習S2発表～相反定理と地震波シミュレーション～</header>
<h2 id="%E3%82%B7%E3%83%9F%E3%83%A5%E3%83%AC%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B32-14-%E7%9B%B8%E5%8F%8D%E5%AE%9A%E7%90%86%E3%81%AE%E5%BF%9C%E7%94%A8">シミュレーション2 (1/4) ～相反定理の応用～</h2>
<p>相反定理を利用し、観測点で記録された地震波形を<strong>時間反転させてから観測点に注入</strong>することで、波を震源へと逆伝播させることを考える。</p>
<blockquote>
<p><strong>【時間反転計算で分かること】</strong><br />
・<strong>震源の位置と発生時刻</strong>：波が空間上の一点に最も強く収束する場所とタイミング。<br />
・<strong>震源メカニズム</strong>：収束した波の変位やひずみの空間分布から、断層の向きやすべり方向も推定可能。</p>
</blockquote>

<h2 id="%E3%82%B7%E3%83%9F%E3%83%A5%E3%83%AC%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B32-44-%E7%9B%B8%E5%8F%8D%E5%AE%9A%E7%90%86%E3%81%AE%E5%BF%9C%E7%94%A8">シミュレーション2 (4/4) ～相反定理の応用～</h2>
<table>
<thead>
<tr>
<th style="text-align:center"><img src="image.png" alt="" style="width:350px;" /></th>

</table>
<p><strong>【結果】</strong><br />
・発震時刻（<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="4.965ex" height="1.557ex" role="img" focusable="false" viewBox="0 -666 2194.6 688"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D461" d="M26 385Q19 392 19 395Q19 399 22 411T27 425Q29 430 36 430T87 431H140L159 511Q162 522 166 540T173 566T179 586T187 603T197 615T211 624T229 626Q247 625 254 615T261 596Q261 589 252 549T232 470L222 433Q222 431 272 431H323Q330 424 330 420Q330 398 317 385H210L174 240Q135 80 135 68Q135 26 162 26Q197 26 230 60T283 144Q285 150 288 151T303 153H307Q322 153 322 145Q322 142 319 133Q314 117 301 95T267 48T216 6T155 -11Q125 -11 98 4T59 56Q57 64 57 83V101L92 241Q127 382 128 383Q128 385 77 385H26Z"></path></g><g data-mml-node="mo" transform="translate(638.8,0)"><path data-c="2248" d="M55 319Q55 360 72 393T114 444T163 472T205 482Q207 482 213 482T223 483Q262 483 296 468T393 413L443 381Q502 346 553 346Q609 346 649 375T694 454Q694 465 698 474T708 483Q722 483 722 452Q722 386 675 338T555 289Q514 289 468 310T388 357T308 404T224 426Q164 426 125 393T83 318Q81 289 69 289Q55 289 55 319ZM55 85Q55 126 72 159T114 210T163 238T205 248Q207 248 213 248T223 249Q262 249 296 234T393 179L443 147Q502 112 553 112Q609 112 649 141T694 220Q694 249 708 249T722 217Q722 153 675 104T555 55Q514 55 468 76T388 123T308 170T224 192Q164 192 125 159T83 84Q80 55 69 55Q55 55 55 85Z"></path></g><g data-mml-node="mn" transform="translate(1694.6,0)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g></g></svg></mjx-container>）において、波が元の震源位置へ収束する様子が確認された。<br />

・「② 震源から離れた観測点のみ」を用いた場合、波の収束が弱く空間的な広がりが残るため、震源位置を特定することが困難であった。</p>
<blockquote>
<p><strong>【結論】</strong><br />
時間反転計算による高精度な震源決定には、<strong>震源を取り囲む十分な観測点網</strong>と、<strong>震源に近い観測点のデータ</strong>が極めて重要である。</p>
</blockquote>

<header>特別演習S2発表～相反定理と地震波シミュレーション～</header>
<h2 id="%E3%81%BE%E3%81%A8%E3%82%81">まとめ</h2>
<p>本演習では、地震波伝播における相反定理の理論的背景を確認し、要素法を用いたシミュレーションによりその性質を検証した。</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>相反定理の成立</strong><br />
波源と観測点を入れ替えても観測される波形は一致する。本シミュレーションを通じ、単一の点力に対する相反性が数値的にも成立することを確認した。</p>
</li>
<li data-marpit-fragment="2">
<p><strong>時間反転計算への応用</strong><br />
観測波形を時間反転させて計算空間に逆伝播させることで、震源の位置や発生時刻を推定できることを確認した。</p>
</li>
<li data-marpit-fragment="3">
<p><strong>震源決定における観測点配置の重要性</strong><br />
観測点の数や配置が、波の収束度合いに直結する。精度の高い震源決定には、適切な観測点網が必要不可欠であることが分かった。</p>
</li>
</ul>
